name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dry-run:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/Test-Purge.ps1
